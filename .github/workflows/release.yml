# The one CI surface: build and publish the Linux packages when a version
# tag lands. Tests run locally (./dev.sh test-all); nothing here tests.
#
# The action versions are pinned to the ones that run on Node 24: nothing here
# uses Node itself, but GitHub's own actions are JavaScript and the runner
# executes them, so their major version is how the runtime is chosen.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - run: ./dev.sh build
      - run: ./dev.sh package
      - uses: actions/upload-artifact@v6
        with:
          name: dist-${{ matrix.runner }}
          path: |
            dist/*.deb
            dist/*.tar.gz

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          --repo "$GITHUB_REPOSITORY"
          --title "noob $GITHUB_REF_NAME"
          --notes "CHANGELOG.md holds what this version does."
          dist/*
