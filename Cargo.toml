[workspace]
resolver = "2"
members = ["crates/noob", "crates/noob-proto", "crates/noob-provider", "crates/noob-testkit"]
# CLIppy is its own workspace with its own lockfile. The CLI's budget is 8 MiB
# and 45 runtime crates, and a GPU stack is several hundred crates on its own:
# sharing a lockfile would put them one careless `workspace = true` apart. They
# share exactly one thing, `crates/noob-proto`, by path.
exclude = ["gui"]

[workspace.package]
version = "0.11.12"
edition = "2024"
rust-version = "1.96"
license = "MIT"
repository = "https://github.com/hec-ovi/noob-cli"

[workspace.dependencies]
noob-proto = { path = "crates/noob-proto" }
noob-provider = { path = "crates/noob-provider" }
noob-testkit = { path = "crates/noob-testkit" }
# Pinned exactly: we implement a custom transport on ureq's `unversioned` API,
# which is explicitly outside its semver promises.
ureq = { version = "=3.3.0", default-features = false, features = ["rustls"] }
serde = "1.0.228"
serde_json = "1.0.150"
libc = "0.2.186"
regex = "1.13"
ignore = "0.4.28"
tempfile = "3.27"
tiktoken-rs = "0.12"

[profile.release]
opt-level = "s"
lto = "fat"
# Worker and dock fault boundaries convert panics into typed outcomes and
# restore the terminal. Production must unwind for those boundaries to exist.
panic = "unwind"
strip = true
codegen-units = 1
