[package]
name = "noob-draw"
description = "G1/G2: instanced rectangles and shaped glyphs, and nothing else."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
noob-gpu.workspace = true
wgpu.workspace = true
glyphon.workspace = true
# Feature-only: see the note in the workspace manifest. Nothing here imports it
# directly; the shaper reaches this crate through `glyphon::cosmic_text`.
cosmic-text.workspace = true
bytemuck.workspace = true
# The wrap rule, so the rows this crate draws are the rows the window counts.
# See layers/text-geometry/CONTRACT.md; nothing in here re-derives it.
text-geometry.workspace = true

# The shader is a string until a GPU compiles it, so a typo in it is a black
# window rather than a build error. This is wgpu's own front end, already in the
# tree at the same version, so the test compiles the shader the way the driver
# will.
[dev-dependencies]
naga = { version = "30", features = ["wgsl-in"] }
