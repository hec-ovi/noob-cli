[package]
# The window is NO0B. The folder is still `clippy` on disk: renaming it moves
# every path in dev.sh, the docs and the layer index for nothing a user sees.
name = "no0b"
description = "NO0B: the GPU front end for noob."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "no0b"
path = "src/main.rs"

[dependencies]
noob-proto.workspace = true
noob-gpu.workspace = true
noob-draw.workspace = true
text-geometry.workspace = true
wgpu.workspace = true
winit.workspace = true
pollster.workspace = true
copypasta = "0.10.2"

[dev-dependencies]
# Test-only: tool arguments arrive as an opaque JSON value, so building one
# is how a test names what the model asked for.
serde_json.workspace = true
