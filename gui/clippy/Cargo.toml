[package]
# The window is NO0B. The folder is still `clippy` on disk: renaming it moves
# every path in dev.sh, the docs and the layer index for nothing a user sees.
name = "no0b"
description = "NO0B: the GPU front end for noob."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "no0b"
path = "src/main.rs"

[dependencies]
# The agent's session files are JSONL, and the picker reads the head of one to
# say what a saved session was about. Already in the graph under `noob-proto`,
# so naming it here costs no crate.
serde_json.workspace = true
noob-proto.workspace = true
noob-gpu.workspace = true
noob-draw.workspace = true
text-geometry.workspace = true
wgpu.workspace = true
winit.workspace = true
pollster.workspace = true
copypasta = "0.10.2"
