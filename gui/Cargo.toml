# NO0B: the GPU front end. Its own workspace, deliberately.
#
# The CLI is capped at 8 MiB and 45 runtime crates, and those are published
# claims rather than preferences. A GPU stack is several hundred crates. One
# lockfile for both would put a `workspace = true` between the two budgets, so
# they are kept apart and share exactly one thing: `crates/noob-proto`, by path.
[workspace]
resolver = "2"
# `clippy/` is the NO0B window. The package and the binary are both `no0b`; only
# the folder still carries the old name, because renaming it would move every
# path in dev.sh, the docs and the layer index and change nothing a user sees.
members = ["noob-gpu", "noob-draw", "clippy", "layers/text-geometry"]

[workspace.package]
version = "0.12.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
repository = "https://github.com/hec-ovi/noob-cli"

[workspace.dependencies]
noob-proto = { path = "../crates/noob-proto" }
noob-gpu = { path = "noob-gpu" }
noob-draw = { path = "noob-draw" }
text-geometry = { path = "layers/text-geometry" }
wgpu = "30"
winit = "0.30"
glyphon = "0.12"
# glyphon's shaper, named here only to turn two of its features on. Cargo
# unifies features across the graph, so glyphon's copy gets them too.
# `shape-run-cache` keeps a shaped run keyed by its text, which is what makes
# fallback shaping cheaper than the no-fallback path across frames;
# `monospace_fallback` makes a fallback prefer a monospace face, so a
# substituted glyph stays on the column grid where one exists.
cosmic-text = { version = "0.19", default-features = false, features = [
    "shape-run-cache",
    "monospace_fallback",
] }
pollster = "0.4"
serde_json = "1.0.150"
bytemuck = { version = "1", features = ["derive"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 1

# A debug build of a renderer is unusable at any resolution, and the
# dependencies never change, so they are optimized even in dev.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
